services:
  api:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file: .env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/social-media-api
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
